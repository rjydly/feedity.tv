name: Feedity Video Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # S'executa cada 6 hores
  workflow_dispatch:        # Permet execució manual des de la pestanya Actions de GitHub

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama & Pull Gemma 2 Model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull gemma2

      - name: Run Main Script
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_COOKIES_FILE: ${{ secrets.INSTAGRAM_COOKIES_FILE }}
        run: python main.py

      - name: Commit and Push Processed IDs
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add processed_videos.json || true
          git commit -m "Update processed videos history [skip ci]" || true
          git push || true
