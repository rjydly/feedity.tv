name: Feedity Reel Processing Pipeline

on:
  schedule:
    # S'executa cada 6 hores automàticament
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permet l'execució manual des de la pestanya Actions

jobs:
  process-reels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apify-client>=1.8.0 opencv-python-headless>=4.8.0 pillow>=10.0.0 moviepy>=2.0.0 requests>=2.31.0 ollama>=0.1.0 numpy>=1.24.0

      - name: Install and Start Ollama Service
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull gemma2

      - name: Run Main Processing Script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and Push Processed Video History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_videos.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: add processed video id" && git push)
