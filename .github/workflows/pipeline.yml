name: Feedity Video Pipeline

on:
  schedule:
    # S'executa a les 13:00, 17:00, 21:00 i 01:00 UTC (9:00 AM, 1:00 PM, 5:00 PM i 9:00 PM a Nova York)
    - cron: '0 1,13,17,21 * * *'
  workflow_dispatch:        # Permet executar-lo manualment des de GitHub quan vulguis

jobs:
  build-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Cookies File if Secret Exists
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          if [ -n "$INSTAGRAM_COOKIES" ]; then
            echo "$INSTAGRAM_COOKIES" > cookies.txt
            echo "Galetes d'Instagram configurades correctament."
          fi

      - name: Run Main Script
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          INSTAGRAM_COOKIES_FILE: "cookies.txt"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      - name: Commit and Push Status and Media
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add processed_videos.json sources.csv final_feedity.mp4 final_thumbnail.jpg || true
          git commit -m "Update pipeline state and media assets [skip ci]" || true
          git push || true