name: Feedity Pipeline

on:
  schedule:
    # S'executa cada dia a les 12:00 i a les 18:00 UTC
    - cron: '0 12,18 * * *'
  workflow_dispatch: # Permet executar el script manualment des de GitHub Actions

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configurar entorn de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instal·lar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instal·lar i arrancar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull gemma2

      - name: Instal·lar la darrera versió de yt-dlp
        run: |
          python -m pip install --upgrade yt-dlp

      - name: Executar Pipeline de Feedity
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Desa l'historial de vídeos processats (Si no està en TEST_MODE)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f processed_videos.json ]; then
            git add processed_videos.json
            git commit -m "chore: update processed videos history [skip ci]" || exit 0
            git push
          else
            echo "El fitxer processed_videos.json no existeix encara (normal en TEST_MODE)."
          fi

      - name: Instal·lar i arrancar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull gemma2

      - name: Instal·lar la darrera versió de yt-dlp
        run: |
          python -m pip install --upgrade yt-dlp

      - name: Executar Pipeline de Feedity
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Desa l'historial de vídeos processats (Si no està en TEST_MODE)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_videos.json
          git commit -m "chore: update processed videos history [skip ci]" || exit 0
          git push
